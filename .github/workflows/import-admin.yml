name: Assemble Forms admin source

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/import-admin.yml'
      - '.import/admin_*.part'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
      - name: Assemble exact tested admin file
        shell: bash
        run: |
          mkdir -p admin
          cat .import/admin_00.part .import/admin_01.part .import/admin_02.part .import/admin_03.part .import/admin_04.part > admin/index.php
          rm -rf .import
          rm -f .github/workflows/import-admin.yml
      - name: Commit assembled source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Forms 0.3.2 admin source"
          git push origin HEAD:develop
